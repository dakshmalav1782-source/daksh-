<!DOCTYPE html>
<html>
<head>
  <title>Firebase Auth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen text-white">

<div class="bg-gray-800 p-8 rounded-xl w-80 text-center">

  <h1 class="text-2xl mb-4">Firebase Auth 🔥</h1>

  <input id="email" placeholder="Email"
    class="w-full p-2 mb-3 rounded text-black">

  <input id="password" type="password" placeholder="Password"
    class="w-full p-2 mb-3 rounded text-black">

  <button onclick="signup()"
    class="bg-green-500 w-full py-2 rounded mb-2">
    Sign Up
  </button>

  <button onclick="login()"
    class="bg-blue-500 w-full py-2 rounded">
    Login
  </button>

  <p id="output" class="mt-4 text-green-400"></p>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCeo_Uk7AqmQpEjlTgiA32GssryrtIrL5g",
    authDomain: "my-project-85e5a.firebaseapp.com",
    projectId: "my-project-85e5a",
    storageBucket: "my-project-85e5a.firebasestorage.app",
    messagingSenderId: "795726759832",
    appId: "1:795726759832:web:1b7757737581fb3ec28ded",
    measurementId: "G-50FWE7YMD7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // SIGN UP
  window.signup = async function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      await createUserWithEmailAndPassword(auth, email, password);
      document.getElementById("output").innerText = "User created ✅";
    } catch (err) {
      document.getElementById("output").innerText = err.message;
    }
  };

  // LOGIN
  window.login = async function () {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);

    // 🔥 REDIRECT HERE
    window.location.href = "dashboard.html";

  } catch (err) {
    document.getElementById("output").innerText = err.message;
  }
};
</script>

</body>
</html>
